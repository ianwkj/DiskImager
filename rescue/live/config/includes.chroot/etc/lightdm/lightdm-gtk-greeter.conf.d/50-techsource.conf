# Only seen after signing out: TechSource look instead of a black screen.
[greeter]
background=/usr/share/backgrounds/techsource/wallpaper.png
theme-name=Orchis-Light-Compact
icon-theme-name=Papirus
font-name=Inter 10
default-user-image=/usr/share/pixmaps/diskimager.png
indicators=~host;~spacer;~clock;~spacer;~power
clock-format=%a %d %b, %H:%M
